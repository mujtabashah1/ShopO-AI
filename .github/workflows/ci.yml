name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: pip install -r python-ai/requirements.txt
      - run: npm run test:server
      - run: python -m unittest discover -s python-ai/tests -p 'test_*.py'
      - run: npm --prefix client test -- --watchAll=false --runInBand
      - run: npm run build
