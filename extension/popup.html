<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartShop AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="SmartShop AI" width="24" height="24">
        <span>SmartShop AI</span>
      </div>
      <div id="statusDot" class="status-dot disconnected"></div>
    </div>

    <div id="statusText" class="status-text">Disconnected</div>

    <div class="form-group">
      <label for="serverUrl">Server URL</label>
      <input type="text" id="serverUrl" value="http://localhost:5000" placeholder="http://localhost:5000">
    </div>

    <div class="form-group">
      <label for="authToken">Auth Token (JWT)</label>
      <input type="password" id="authToken" placeholder="Paste your JWT token here">
      <small class="hint">Copy from browser DevTools: localStorage.getItem('smartshop_token')</small>
    </div>

    <button id="connectBtn" class="btn btn-primary">Connect</button>
    <button id="disconnectBtn" class="btn btn-secondary" style="display:none;">Disconnect</button>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Active Tasks</span>
        <span id="activeTasks" class="stat-value">0</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
