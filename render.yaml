services:
  # 1. Node.js Backend API
  - type: web
    name: smart-shopping-api
    env: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # e.g. https://your-vercel-app.vercel.app
      - key: PYTHON_AI_ENABLED
        value: true
      - key: PYTHON_AI_HOSTPORT
        fromService:
          type: pserv
          name: smart-shopping-ai
          property: hostport
      - key: PYTHON_AI_KEY
        fromService:
          type: pserv
          name: smart-shopping-ai
          envVarKey: PYTHON_AI_KEY
      - key: LLM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PROXY_USER
        sync: false
      - key: PROXY_PASS
        sync: false
      - key: PROXY_LIST
        sync: false

  # 2. Python AI Engine
  - type: pserv
    name: smart-shopping-ai
    env: python
    rootDir: python-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: PYTHON_AI_KEY
        generateValue: true
